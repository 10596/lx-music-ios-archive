name: 使用问题
description: 安装、签名或运行过程中遇到的问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认：

        - 已阅读 README 的「安全提示」与「常见问题」
        - 安装包来自本仓库 Releases，且已通过 SHA256 校验

        > 本仓库为存档性质的第三方构建，问题不一定能及时处理。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 见 Release 标签，例如 v1.9.1-v28
      placeholder: v1.9.1-v28
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      description: 机型 + iOS 版本
      placeholder: iPhone 15 / iOS 26.3
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: 安装方式
      options:
        - AltStore
        - SideStore
        - Sideloadly
        - TrollStore
        - 其他
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 问题描述
      description: 请写明复现步骤、预期结果与实际结果
      placeholder: |
        1. 打开应用
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 截图、日志或已尝试的排查步骤
    validations:
      required: false
